services:
  mongodb:
    image: mongo:7.0
    ports:
      - "127.0.0.1:27020:27017"
    volumes:
      - messenger-complete-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  messenger-complete-data:
